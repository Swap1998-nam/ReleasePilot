<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReleasePilot</title><style>body{font-family:system-ui;background:#0b1220;color:#e7f0fc;margin:0}main{max-width:900px;margin:50px auto;padding:20px}h1{font-size:3em;color:#6ee7ce}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#18263b;border:1px solid #38516f;border-radius:18px;padding:25px}label{display:block;margin:17px 0}input[type=number]{display:block;width:90%;margin-top:6px;padding:10px;background:#101b2b;color:white;border:1px solid #627a96;border-radius:7px}button{background:#6ee7ce;border:0;border-radius:8px;padding:13px 25px;font-weight:bold;cursor:pointer}#score{font-size:4em}li{margin:10px}p{color:#acbed2}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><main><h1>ReleasePilot</h1><p>Smart release readiness simulator. No database, no login, no dependencies.</p><div class="grid"><section class="card"><h2>Release signals</h2><label><input type="checkbox" id="tests_passed" checked> Tests pass</label><label>Coverage %<input type="number" id="coverage" value="85" min="0" max="100"></label><label>Critical vulnerabilities<input type="number" id="critical_vulnerabilities" value="0" min="0"></label><label>High vulnerabilities<input type="number" id="high_vulnerabilities" value="0" min="0"></label><label><input type="checkbox" id="image_signed" checked> Image signed</label><label><input type="checkbox" id="rollback_ready" checked> Rollback ready</label><label>Replicas<input type="number" id="replicas" value="2" min="0"></label><button id="go">Assess release</button></section><section class="card" aria-live="polite"><h2>Decision</h2><div id="score">—</div><h2 id="verdict">Ready to assess</h2><ul id="findings"></ul><p>Practice policy: failed tests or any critical vulnerability blocks release.</p></section></div></main><script>document.getElementById('go').onclick=async()=>{const d={};for(const k of ['coverage','critical_vulnerabilities','high_vulnerabilities','replicas'])d[k]=Number(document.getElementById(k).value);for(const k of ['tests_passed','image_signed','rollback_ready'])d[k]=document.getElementById(k).checked;try{const r=await fetch('/api/assess',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)throw Error(j.error);document.getElementById('score').textContent=j.score+'/100';document.getElementById('verdict').textContent=j.verdict;const f=document.getElementById('findings');f.replaceChildren(...(j.findings.length?j.findings:['All checks passed']).map(s=>{const li=document.createElement('li');li.textContent=s;return li}))}catch(e){document.getElementById('verdict').textContent=e.message}};document.getElementById('go').click()</script></html>
